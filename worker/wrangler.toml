# Typing Zen's ranking board (see README.md). Deployed headless with worker/deploy.sh (wrangler +
# CLOUDFLARE_API_TOKEN from ~/projects/typing-zen-cloudflare.env, never printed; no browser login).
name = "typing-zen-board"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "typing-zen-board"
database_id = "b3375c69-6455-4f07-b53d-531fcdc28b73"
